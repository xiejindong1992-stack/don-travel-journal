<!doctype html>
<html lang="zh-CN">

<body>
  <div class="reading-progress" aria-hidden="true"></div>
  <header class="site-header" id="site-header">
    <a class="brand" href="#cover" aria-label="DON 的旅行影像手记，返回封面">DON<span class="brand-comma"> · </span>沿途</a>
    <nav class="desktop-nav" aria-label="主导航">
      <a href="#map" data-nav="map">地图</a>
      <a href="#year-2025" data-nav="year-2025">2025</a>
      <a href="#year-2026" data-nav="year-2026">2026</a>
      <a href="#index" data-nav="index">影像索引</a>
      <a href="#flights" data-nav="flights">飞行档案</a>
      <details class="journey-menu"><summary>全部旅程 <span aria-hidden="true">⌄</span></summary><div class="journey-menu-panel" id="journey-menu-panel"></div></details>

    <details class="mobile-nav">
      <summary aria-label="打开目录"><span></span><span></span></summary>
      <nav aria-label="移动端目录">

      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="关闭照片">关闭 <span aria-hidden="true">×</span></button>
      <button type="button" class="lightbox-arrow lightbox-arrow-prev" id="lightbox-prev" aria-label="上一张照片">‹</button>
      <figure class="lightbox-figure">
        <img id="lightbox-image" alt="">
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button type="button" class="lightbox-arrow lightbox-arrow-next" id="lightbox-next" aria-label="下一张照片">›</button>
      <div class="lightbox-count" id="lightbox-count" aria-live="polite"></div>
    </div>
  </dialog>
